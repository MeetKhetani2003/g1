    <path d="M50 4 C78 4 100 26 100 54 C100 82 78 100 50 100 C30 100 12 88 6 70 C12 84 28 92 46 92 C70 92 90 74 90 52 C90 30 70 12 46 12 C32 12 20 18 12 28 C18 12 32 4 50 4 Z" fill="url(#g1teal)"/>
